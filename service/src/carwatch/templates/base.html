<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Car Watch{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d232b; --muted: #66707d; --line: #e3e6ea;
      --accent: #2f6fdf; --down: #13814a; --down-bg: #e3f5ea; --up: #b4372f; --up-bg: #fbe9e7;
      --chip: #eef1f5;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b; --card: #1c2026; --text: #e6e9ed; --muted: #98a2ae; --line: #2c323a;
        --accent: #6ea0ff; --down: #5fd394; --down-bg: #17321f; --up: #ff8a7f; --up-bg: #3a1d1a;
        --chip: #262b33;
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { display: flex; align-items: center; gap: 24px; padding: 12px 24px;
             background: var(--card); border-bottom: 1px solid var(--line); }
    header .brand { font-weight: 700; font-size: 16px; color: var(--text); }
    header nav a { margin-right: 16px; color: var(--muted); }
    header nav a.on { color: var(--text); font-weight: 600; }
    header .stats { margin-left: auto; color: var(--muted); font-size: 13px; }
    main { padding: 20px 24px 48px; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .thumb { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--chip); display: block; }
    .delta { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 12px; margin-left: 4px; }
    .delta.down { color: var(--down); background: var(--down-bg); }
    .delta.up { color: var(--up); background: var(--up-bg); }
    .chip { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 10px;
            background: var(--chip); font-size: 12px; }
    form.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
    form.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
    form.filters label.check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
    input, select, button { font: inherit; color: var(--text); background: var(--card);
                            border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    input.short { width: 100px; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; padding: 6px 14px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { margin: 0; }
    .price-big { font-size: 28px; font-weight: 700; }
    .chart { width: 100%; height: auto; }
    .chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .chart .dot { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
    .chart .grid { stroke: var(--line); stroke-dasharray: 3 4; }
    .chart .axis { fill: var(--muted); font-size: 12px; }
    .chart .series { fill: none; stroke-width: 2; }
    .chart .mark { stroke: var(--card); stroke-width: 2; }
    .chart .label { fill: var(--text); font-size: 12px; }
    .chart a:hover .mark { stroke: var(--text); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 8px; font-size: 13px; }
    .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .note { background: var(--chip); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
    .pill.good { background: var(--down-bg); color: var(--down); }
    .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
    form.inline { display: inline; }
    button.secondary { background: transparent; color: var(--accent); }
    .desc { white-space: pre-wrap; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .section { margin-top: 16px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--chip); }
    .pill.warn { background: var(--up-bg); color: var(--up); }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Car Watch</a>
    <nav>
      <a href="/market" class="{{ 'on' if page == 'market' }}">Tržište</a>
      <a href="/deals" class="{{ 'on' if page == 'deals' }}">Ponude</a>
      <a href="/compare" class="{{ 'on' if page == 'compare' }}">Uporedi</a>
      <a href="/" class="{{ 'on' if page == 'ads' }}">Oglasi</a>
      <a href="/searches" class="{{ 'on' if page == 'searches' }}">Pretrage</a>
      <a href="/runs" class="{{ 'on' if page == 'runs' }}">Povlačenje</a>
    </nav>
    <span class="stats">{% block stats %}{% endblock %}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
